name: game_forge
description: A platform to build and play mini-games.
publish_to: 'none'

version: 1.5.0+7

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Backend
  supabase_flutter: ^2.5.0
  
  # Navigation
  go_router: ^14.0.0
  
  # Game Engine
  flame: ^1.17.0
  
  # UI & Styling
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  uuid: ^4.5.3
  shared_preferences: ^2.3.0
  url_launcher: ^6.2.6

  # In-app updates (Android APK)
  http: ^1.2.2
  package_info_plus: ^8.1.2
  open_file: ^3.5.10
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  audioplayers: ^6.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/app_icon.png"
